# Render Configuration for TikTok Viral Coach Backend

services:
  - type: web
    name: tiktok-viral-coach-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements-prod.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 300 --worker-class sync"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: GOOGLE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tiktok-coach-db
          property: connectionString
      - key: DEV_MODE
        value: "false"
      - key: BACKEND_URL
        value: "https://tiktokcoachapp.onrender.com"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

databases:
  - name: tiktok-coach-db
    plan: free
    region: oregon
    databaseName: tiktok_coach
    user: tiktok_coach_user

# DEPLOYMENT STEPS:
# 1. Push backend code to GitHub
# 2. In Render dashboard: "New +" → "Blueprint" → connect your repo
# 3. Render reads this file and creates both web service + database
# 4. Add secrets manually in dashboard (sync: false vars):
#    - GOOGLE_API_KEY: your Google AI API key
#    - ANTHROPIC_API_KEY: your Anthropic API key
#    - SMTP_USER: Gmail address for OTP emails
#    - SMTP_PASSWORD: Gmail App Password (not your Gmail password)
# 5. DATABASE_URL is auto-injected from the linked database
